name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Debug key file
        run: |
          echo "Taille fichier: $(wc -c < ~/.ssh/id_rsa) bytes"
          echo "Nb lignes: $(wc -l < ~/.ssh/id_rsa)"
          echo "Première ligne: $(head -1 ~/.ssh/id_rsa)"
          echo "Dernière ligne: $(tail -1 ~/.ssh/id_rsa)"
          ssh-keygen -l -f ~/.ssh/id_rsa 2>&1 || echo "INVALID KEY"

      - name: Test SSH connection
        run: ssh -o StrictHostKeyChecking=no -p 65002 ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "echo 'SSH OK'"

      - name: Deploy on VPS
        run: |
          ssh -o StrictHostKeyChecking=no -p 65002 ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            set -e
            cd /home/u875897864/domains/slategray-goose-756276.hostingersite.com/public_html
            git pull origin main
            composer install --no-dev --optimize-autoloader
            php bin/console cache:clear --env=prod
            php bin/console asset-map:compile
            echo 'Déployé avec succès'
          "
