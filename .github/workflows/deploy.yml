name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: ssh-keyscan -p 65002 ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy on VPS
        run: |
          ssh -p 65002 ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "set -e
            cd /home/u875897864/domains/slategray-goose-756276.hostingersite.com/public_html
            git pull origin main
            composer install --no-dev --optimize-autoloader
            php bin/console cache:clear --env=prod
            php bin/console asset-map:compile
            echo '✓ Déployé avec succès'"
