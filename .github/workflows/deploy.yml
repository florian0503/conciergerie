name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 65002 ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Debug key file
        run: |
          echo "Taille fichier: $(wc -c < ~/.ssh/id_rsa) bytes"
          echo "Nb lignes: $(wc -l < ~/.ssh/id_rsa)"
          echo "Première ligne: $(head -1 ~/.ssh/id_rsa)"
          echo "Dernière ligne: $(tail -1 ~/.ssh/id_rsa)"
          ssh-keygen -l -f ~/.ssh/id_rsa 2>&1 || echo "INVALID KEY"

      - name: Test SSH connection
        run: ssh -o StrictHostKeyChecking=no -p 65002 ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "echo 'SSH OK'"

      - name: Deploy on VPS
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ssh -o StrictHostKeyChecking=no -p 65002 ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            set -e
            cd /home/u875897864/domains/lescleslyonnaises.fr/public_html
            git fetch origin main
            git reset --hard origin/main
            echo 'APP_ENV=prod' > .env.local
            echo 'APP_DEBUG=0' >> .env.local
            echo 'DATABASE_URL=${{ secrets.DATABASE_URL }}' >> .env.local
            composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-redis
            php bin/console doctrine:migrations:migrate --no-interaction --env=prod
            php bin/console cache:clear --env=prod
            php bin/console asset-map:compile
            echo 'Déployé avec succès'
          "
